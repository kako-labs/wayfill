<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뽀동이 · 새 애니메이션 5종</title><link rel="stylesheet" href="style.css"><style>main{max-width:1180px;margin:40px auto;padding:24px}h1{font-size:36px;margin:12px 0}p{color:var(--muted);line-height:1.8}.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:32px 0}.clip{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center}.clip canvas{width:100%;height:auto;aspect-ratio:1}.clip h2{font-size:21px}.clip p{font-size:14px;min-height:76px}.clip button{width:100%;padding:12px;border-radius:12px;background:var(--gold);border:0;font-weight:700}.clip small{display:block;margin:12px;color:var(--muted)}.primary{min-height:60px;font-size:20px}#status{min-height:32px}</style>
<main><a href="index.html">← 차량 UI로 돌아가기</a><h1>메시지 곁에서, 살아 움직이는 뽀동이</h1><p>동작을 크게, 연결은 부드럽게 · 72프레임 · 투명 배경 · 무음<br>준비 자세 → 크게 반응하기 → 여운을 남기며 쉬기. 정차 중 표현을 다시 만들었어요.</p><button class="primary" id="play">다 같이 다시 보기</button><label style="margin-left:18px"><input type="checkbox" id="loop-preview" checked> 반복 미리보기</label><div class="clips" id="clips"></div><p id="status" aria-live="polite"></p><p>주행 중에는 작은 크기로 6초에 한 번 눈만 깜빡여요. 정차·주유 인사는 한 번 재생하고 곁에 남아요.<br>정차 동작은 16프레임, 차분한 기본 동작은 8프레임입니다. Android Compose에서도 같은 원본과 타이밍을 사용해요.</p></main>
<script src="animation-data.js"></script><script src="podong-animation.js"></script><script>
const labels={calm:['조용히 함께','눈 깜빡임과 작은 숨쉬기. 주행 중 기본 모습.'],recommend:['여기 들를까요?','오른손을 들어 주유소를 가리키고 고개를 끄덕여요.'],small:['냠, 간식!','팔을 높이 들어 크게 손인사하고 천천히 내려요.'],full:['빵빵해요!','몸을 꾹 움츠렸다가 양팔을 크게 펴며 좋아해요.'],recovery:['살았다…!','지친 표정에서 양팔을 머리 위로 쭉 뻗으며 안도해요.']};
document.getElementById('clips').innerHTML=["full","recovery","small","recommend","calm"].map(id=>[id,labels[id]]).map(([id,[title,desc]])=>`<section class="clip"><canvas width="256" height="256" id="${id}" role="img" aria-label="${title}"></canvas><h2>${title}</h2><p>${desc}</p><button data-clip="${id}">다시 재생</button><small>${PodongData.clips[id].frames.length}프레임 · ${PodongData.clips[id].durationMs}ms</small><a href="${PodongData.clips[id].file}" download>WebP 받기</a></section>`).join('');
const stops={},timers={};function play(id){clearTimeout(timers[id]);stops[id]?.();stops[id]=PodongAnimation.mount(document.getElementById(id),id,{onDone:()=>{if(document.getElementById('loop-preview').checked&&!matchMedia('(prefers-reduced-motion: reduce)').matches)timers[id]=setTimeout(()=>play(id),800);}});}
document.getElementById('loop-preview').onchange=e=>{if(e.target.checked)Object.keys(labels).forEach(play);else Object.values(timers).forEach(clearTimeout);};
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>play(b.dataset.clip));document.getElementById('play').onclick=()=>Object.keys(labels).forEach(play);Object.keys(labels).forEach(play);
</script></html>
