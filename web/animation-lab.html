<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뽀동이 · 새 애니메이션 5종</title><link rel="stylesheet" href="style.css"><style>main{max-width:1180px;margin:40px auto;padding:24px}h1{font-size:36px;margin:12px 0}p{color:var(--muted);line-height:1.8}.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:32px 0}.clip{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center}.clip canvas{width:100%;height:auto;aspect-ratio:1}.clip h2{font-size:21px}.clip p{font-size:14px;min-height:76px}.clip button{width:100%;padding:12px;border-radius:12px;background:var(--gold);border:0;font-weight:700}.clip small{display:block;margin:12px;color:var(--muted)}.primary{min-height:60px;font-size:20px}#status{min-height:32px}</style>
<main><a href="index.html">← 차량 UI로 돌아가기</a><h1>메시지 곁에서, 살아 움직이는 뽀동이</h1><p>GPT로 새로 그린 40프레임 · 투명 배경 · 무음<br>손과 눈, 몸 방향이 바뀌는 실제 프레임 애니메이션이에요.</p><button class="primary" id="play">다 같이 다시 보기</button><div class="clips" id="clips"></div><p id="status" aria-live="polite"></p><p>주행 중에는 작은 크기로 6초에 한 번 눈만 깜빡여요. 정차·주유 인사는 한 번 재생하고 곁에 남아요.<br>8프레임씩 구성한 스프라이트입니다. Android Compose에서도 같은 원본과 타이밍을 사용해요.</p></main>
<script src="animation-data.js"></script><script src="podong-animation.js"></script><script>
const labels={calm:['조용히 함께','눈 깜빡임과 작은 숨쉬기. 주행 중 기본 모습.'],recommend:['여기 들를까요?','오른손을 들어 주유소를 가리키고 고개를 끄덕여요.'],small:['냠, 간식!','왼손으로 짧게 인사하고 살짝 고개를 기울여요.'],full:['빵빵해요!','볼을 비비고 뒤돌아 엉덩이를 좌우로 움직여요.'],recovery:['살았다…!','지친 표정에서 배를 쓸고 기지개를 켜며 회복해요.']};
document.getElementById('clips').innerHTML=Object.entries(labels).map(([id,[title,desc]])=>`<section class="clip"><canvas width="256" height="256" id="${id}" role="img" aria-label="${title}"></canvas><h2>${title}</h2><p>${desc}</p><button data-clip="${id}">다시 재생</button><small>8프레임 · ${PodongData.clips[id].durationMs}ms</small><a href="${PodongData.clips[id].file}" download>WebP 받기</a></section>`).join('');
const stops={};function play(id){stops[id]?.();stops[id]=PodongAnimation.mount(document.getElementById(id),id);}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>play(b.dataset.clip));document.getElementById('play').onclick=()=>Object.keys(labels).forEach(play);Object.keys(labels).forEach(play);
</script></html>
