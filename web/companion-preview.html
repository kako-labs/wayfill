<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUEL PILOT · 소프트 선셋</title><link rel="stylesheet" href="companion-preview.css"><link rel="stylesheet" href="sunset-theme.css"><link rel="stylesheet" href="sunset-pages.css"></head>
<body><header class="review-bar"><a href="ui-gallery.html">FUEL PILOT <span>DESIGN REVIEW</span></a><span class="demo-label">예시 데이터 · 차량 연결 전 화면 검토</span></header>
<main><form id="controls" class="review-controls" aria-label="미리보기 조건">
<label>화면<select id="surface"><option value="full">정차 홈</option><option value="split">내비 옆 작은 창</option><option value="background">백그라운드 알림</option></select></label>
<label>차량<select id="motion"><option value="parked">정차 중</option><option value="moving">주행 중</option><option value="unknown">상태 미확인</option></select></label>
<label>정보<select id="data"><option value="ready">최신 정보</option><option value="stale">최신 정보 대기</option><option value="unsupported">지원되지 않음</option></select></label>
<label>상황<select id="scenario"><option value="destination">목적지 전 주유 필요</option><option value="passing">지나치기 전 · 3km 앞</option><option value="long">긴 주유소 이름</option><option value="noaction">중간 주유 필요 없음</option></select></label>
<label>주유 시연<select id="refuel-variant"><option value="small">소량 주유</option><option value="full">가득 주유</option><option value="recovery">연료 부족 후 주유</option></select></label><button type="button" id="simulate-refuel" class="reset">예시 주유 확인</button><button type="button" id="duplicate-refuel" class="reset">같은 이벤트 재전달</button><button type="button" id="reset" class="reset">새 추천 ↻</button></form>
<section id="vehicle" class="vehicle full" aria-label="Fuel Pilot 화면 시안"><aside id="app-window" class="app-window"><div id="companion"></div></aside><aside id="notification" class="notification" aria-label="시스템에 전달할 알림 내용"></aside><aside id="surface-explainer" class="surface-explainer"></aside></section>
<div id="response" class="response" hidden><span>내비 응답 시연</span><button type="button" data-result="success">성공 응답 보내기</button><button type="button" data-result="failed">실패 응답 보내기</button></div>
<p id="status" class="review-status" role="status">화면 디자인 검토용입니다. 실제 차량 데이터나 PLEOS 실행 화면이 아닙니다.</p></main><dialog id="history-dialog"><h2>시연 기록을 모두 삭제할까요?</h2><p>주유량·거리 기록을 지워요. 중복 안내를 막는 최소 확인 정보는 유지해요.</p><div><button type="button" id="cancel-history-delete">취소</button><button type="button" id="confirm-history-delete">모두 삭제</button></div></dialog><script src="sunset-motion-data.js"></script><script src="sunset-player.js"></script><script src="sunset-preview-state.js"></script><script src="sunset-pages.js"></script><script src="companion-preview.js"></script></body></html>
